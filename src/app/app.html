<div class="ambient no-print" aria-hidden="true"></div>
<div class="noise no-print" aria-hidden="true"></div>
<div class="progress no-print" aria-hidden="true"></div>

<header class="top-bar no-print">
  <a class="brand" [routerLink]="i18n.link('cv')">
    <span class="brand__mark" aria-hidden="true"></span>
    <span class="brand__name">{{ i18n.content().cv.name }}</span>
  </a>

  <div class="controls">
    <nav class="lang-switch" [attr.aria-label]="ui().language">
      @for (item of languages(); track item.lang) {
        <a
          [routerLink]="item.link"
          [attr.hreflang]="item.lang"
          [attr.lang]="item.lang"
          [attr.aria-current]="item.lang === i18n.lang() ? 'true' : null"
          [title]="item.name"
          >{{ item.lang }}</a
        >
      }
    </nav>

    <button
      type="button"
      class="round-button"
      [attr.aria-label]="ui().theme"
      [title]="ui().theme"
      (click)="theme.toggle()"
    >
      <!-- Both icons render; CSS shows the one for the current theme, so the server and client agree. -->
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4" />
        <path
          d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
        />
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z" />
      </svg>
    </button>
  </div>
</header>

<router-outlet />

<footer class="footer no-print">
  <span>{{ ui().footer.built }}</span>
  <a [href]="profile.source" target="_blank" rel="noopener">{{ ui().footer.source }}</a>
</footer>
